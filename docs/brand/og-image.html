<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden;
background:radial-gradient(120% 90% at 100% 0%, rgb(140 200 255 / .35) 0%, transparent 55%),radial-gradient(80% 60% at 0% 100%, rgb(20 60 140 / .6) 0%, transparent 60%),linear-gradient(150deg,#123a7a 0%,#1c5fcf 58%,#3a86f0 100%);
padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.mtn{position:absolute;right:-40px;bottom:-30px;width:620px;opacity:.12}
.brand{display:flex;align-items:center;gap:18px;font-weight:700;font-size:38px;letter-spacing:-.02em}
.brand svg{width:64px;height:64px;border-radius:16px;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.badge{display:inline-block;margin-left:auto;font-size:22px;font-weight:600;background:rgb(255 255 255 / .16);border:1px solid rgb(255 255 255 / .3);padding:10px 20px;border-radius:999px}
h1{font-size:66px;line-height:1.04;letter-spacing:-.035em;font-weight:700;max-width:900px}
.chips{display:flex;flex-wrap:wrap;gap:12px;max-width:1000px}
.chip{font-size:24px;font-weight:600;background:#fff;color:#123a7a;padding:11px 20px;border-radius:999px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:24px;color:rgb(255 255 255 / .9)}
.foot b{font-weight:700;color:#fff}
</style></head><body>
<svg class="mtn" viewBox="0 0 64 40"><path d="M0 40 L20 10 L31 25 L39 15 L64 40 Z" fill="#fff"/></svg>
<div class="brand"><svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123A7A"/><stop offset=".6" stop-color="#1C5FCF"/><stop offset="1" stop-color="#4A93F5"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><rect width="64" height="64" rx="16" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><path d="M10 46 L25 24 L33 35 L39 28 L54 46 Z" fill="#fff" fill-opacity=".95"/><circle cx="47" cy="17" r="4.5" fill="#BFE0FF"/></svg>SeasonPay<span class="badge">Gratis · piloto 2026–27</span></div>
<h1>Tu temporada en EE. UU., con los números claros</h1>
<div class="chips"><span class="chip">Turnos y propinas</span><span class="chip">Overtime de tu estado</span><span class="chip">Boletas y Social Security</span><span class="chip">Fechas de impuestos</span><span class="chip">Enviar plata a casa</span></div>

</body></html>
