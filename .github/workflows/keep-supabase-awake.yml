# Supabase (plan gratis) pausa proyectos con poca actividad en 7 días.
# Esta tarea hace una consulta pública y liviana una vez al día para que no se pause.
# Usa la clave publicable (la misma que va en la app), no ninguna clave secreta.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 14 * * *' # 14:17 UTC = 9:17 en Lima
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar app_config
        env:
          URL: https://qjmtgrxyjtomirzhdvdq.supabase.co
          KEY: sb_publishable_lShNqR1K9uISNxIeBXz60w_KLGMalKr
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/app_config?select=key&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"
          test "$code" = "200"
